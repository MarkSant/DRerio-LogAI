        find: '    nested = (params or {}).get("analysis")'
        replace: '    nested = {} if getattr(getattr(settings_obj, "video_processing", None), "sharp_turn_threshold_deg_s", None) is not None else (params or {}).get("analysis")'
      - id: zero-override-treated-as-absent
        description: "limiar 0 explicito vira ausente por checagem de truthiness"
        find: 'if isinstance(nested, dict) and nested.get("sharp_turn_threshold") is not None:'
