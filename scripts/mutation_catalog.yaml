# Curated mutation catalogue for scripts/mutation_check.py
#
# Each mutation is a literal, single-occurrence source substitution that changes
# BEHAVIOUR in a way a competent test must notice. The point is not to be
# exhaustive -- it is to prove that the tests guarding the contracts CLAUDE.md
# calls critical actually fail when those contracts break.
#
# Choosing a mutation:
#   - It must change an observable outcome, not a log message or a comment.
#   - `find` must appear EXACTLY ONCE in the file (the runner enforces this).
#   - Prefer inverting a decision over deleting a branch: a deleted branch often
#     fails to import, which any test would "catch" for the wrong reason.
#
# A surviving mutation is a real hole. Fix it by adding the missing test, not by
# deleting the mutation.

modules:
  mask_capture:
    source: src/zebtrack/core/services/mask_capture.py
    tests:
      - tests/core/detection/test_mask_capture.py
      - tests/core/services/test_mask_capture_extended.py
    mutations:
      - id: no-settings-returns-true
        description: "settings_obj None passa a habilitar captura em vez de recusar"
        find: |-
          if settings_obj is None:
                  return False
        replace: |-
          if settings_obj is None:
                  return True
      - id: persist-masks-ignored
        description: "recorder.persist_masks desligado deixa de bloquear a captura"
        find: 'if not bool(getattr(recorder_settings, "persist_masks", False)):'
        replace: 'if False:'
      - id: det-model-accepted
        description: "modelo det passa a ser aceito para captura de mascara"
        find: '!= "seg":'
        replace: '== "seg":'
      - id: rule-not-checked
        description: "regra de ROI diferente de seg_overlap deixa de bloquear"
        find: 'if rule != "seg_overlap":'
        replace: 'if False:'

  external_trigger_gate:
    source: src/zebtrack/core/services/external_trigger_gate.py
    tests:
      - tests/core/services/test_external_trigger_gate.py
      - tests/core/services/test_external_trigger_gate_extended.py
    mutations:
      - id: trigger-off-arms
        description: "gatilho desligado passa a armar em vez de gravar direto"
        find: |-
          if not trigger_requested and not window_needs_arduino:
                  return ExternalTriggerDecision.PROCEED
        replace: |-
          if not trigger_requested and not window_needs_arduino:
                  return ExternalTriggerDecision.ARM_AND_WAIT
      - id: no-arduino-proceeds
        description: "gatilho ligado sem use_arduino GRAVA as cegas em vez de recusar"
        find: 'return ExternalTriggerDecision.REJECT_NO_ARDUINO'
        replace: 'return ExternalTriggerDecision.PROCEED'
      - id: offline-arduino-arms
        description: "Arduino desconectado passa a armar e esperar sinal que nao chega"
        find: 'return ExternalTriggerDecision.REJECT_ARDUINO_OFFLINE'
        replace: 'return ExternalTriggerDecision.ARM_AND_WAIT'
      - id: port-normalizer-drops-strip
        description: "normalize_arduino_port deixa de limpar espacos"
        find: |-
          return str(value).strip()
        replace: |-
          return str(value)
      # ---- v8 F5: analysis window that waits for the Arduino (ADR-011) ----
      - id: window-arduino-arms
        description: "janela com External(arduino) passa a ARMAR (esperar para gravar)"
        find: |-
          log.info("external_trigger_gate.window_waits_for_arduino")
                  return ExternalTriggerDecision.PROCEED
        replace: |-
          log.info("external_trigger_gate.window_waits_for_arduino")
                  return ExternalTriggerDecision.ARM_AND_WAIT
      - id: both-configured-accepted
        description: "gatilho legado + janela com Arduino passa a ser aceito"
        find: 'if trigger_requested and window_needs_arduino:'
        replace: 'if False:'
      - id: window-arduino-not-checked
        description: "janela com Arduino grava sem checar use_arduino nem a porta"
        find: 'if not trigger_requested and not window_needs_arduino:'
        replace: 'if not trigger_requested:'
      - id: nested-arduino-node-missed
        description: "so o no raiz da janela e olhado; External aninhado e ignorado"
        find: |-
          isinstance(node, External) and node.source == "arduino" for node in iter_nodes(root)
        replace: |-
          isinstance(node, External) and node.source == "arduino" for node in (root,)

  session_duration_resolver:
    source: src/zebtrack/core/services/session_duration_resolver.py
    tests:
      - tests/core/services/test_session_duration_resolver.py
      - tests/core/services/test_session_duration_resolver_extended.py
    mutations:
      - id: override-key-order-swapped
        description: "chave de override troca a ordem grupo/sujeito"
        find: 'return f"{_normalize_day(day)}|{str(group).strip()}|{str(subject).strip()}"'
        replace: 'return f"{_normalize_day(day)}|{str(subject).strip()}|{str(group).strip()}"'
      - id: zero-duration-accepted
        description: "duracao zero/negativa deixa de ser rejeitada e perde a gravacao"
        find: 'if duration <= 0 or duration != duration:  # NaN != NaN'
        replace: 'if duration != duration:  # NaN != NaN'
      - id: day-digits-not-normalized
        description: "dia numerico deixa de virar Dia_N, quebrando o casamento da chave"
        find: 'return f"Dia_{int(core)}"'
        replace: 'return core'

  experiment_notes:
    source: src/zebtrack/core/services/experiment_notes.py
    tests:
      - tests/core/services/test_experiment_notes.py
    mutations:
      - id: blank-note-stored
        description: "nota em branco passa a ser gravada em vez de apagar a anterior"
        find: 'if not cleaned:'
        replace: 'if False:'
      - id: legacy-block-key-kept
        description: "regravar a nota do bloco deixa a chave legada viva, que ressuscita ao limpar"
        find: 'notes.pop(_legacy_block_key(day, group), None)'
        replace: 'notes.get(_legacy_block_key(day, group), None)'
      - id: legacy-overrides-new
        description: "nota legada do bloco passa a sobrescrever a nova no relatorio"
        find: 'records.setdefault((record.day, record.group, None), record)'
        replace: 'records[(record.day, record.group, None)] = record'
      - id: subject-note-as-block-note
        description: "nota de sujeito passa a ser tratada como nota do bloco"
        find: 'if record.subject is None:'
        replace: 'if record.subject is not None:'

  arduino_bindings:
    source: src/zebtrack/core/services/arduino_bindings.py
    tests:
      - tests/core/services/test_arduino_bindings_extended.py
    mutations:
      - id: token-conflict-never-detected
        description: "token usado como on_enter e on_exit deixa de ser reportado (trava dispositivo ligado)"
        find: 'for token in sorted(set(enter_by_token) & set(exit_by_token))'
        replace: 'for token in sorted(set(enter_by_token) & set(exit_by_token) & set())'
      - id: exit-tokens-not-indexed
        description: "on_exit deixa de entrar no indice, cegando a varredura de fim de sessao"
        find: |-
          if b.on_exit is not None:
                          exit_by_token.setdefault(b.on_exit, []).append(b.roi)
        replace: |-
          if b.on_exit is None:
                          exit_by_token.setdefault(b.on_exit, []).append(b.roi)

  roi_rule_resolver:
    source: src/zebtrack/core/services/roi_rule_resolver.py
    tests:
      - tests/core/services/test_roi_rule_resolver.py
    mutations:
      - id: default-rule-changed
        description: "regra padrao deixa de ser bbox_intersects"
        find: 'DEFAULT_ROI_INCLUSION_RULE: Final[str] = "bbox_intersects"'
        replace: 'DEFAULT_ROI_INCLUSION_RULE: Final[str] = "centroid_in"'
      - id: seg-and-bbox-thresholds-conflated
        description: "limiar de seg_overlap cai para o de bbox (denominadores diferentes)"
        find: 'DEFAULT_MIN_SEG_OVERLAP_RATIO: Final[float] = 0.3'
        replace: 'DEFAULT_MIN_SEG_OVERLAP_RATIO: Final[float] = 0.10'
      - id: flutter-enter-exit-swapped
        description: "frames de histerese de entrada e saida trocados"
        find: 'DEFAULT_ROI_FLUTTER_ENTER_FRAMES: Final[int] = 2'
        replace: 'DEFAULT_ROI_FLUTTER_ENTER_FRAMES: Final[int] = 3'

  arena_detection_policy:
    source: src/zebtrack/core/services/arena_detection_policy.py
    tests:
      - tests/core/test_arena_detection_policy.py
      - tests/coordinators/test_multi_aquarium_coordinator.py
    mutations:
      - id: project-method-ignored
        description: "aquarium_method do projeto deixa de ser lido (volta a fixar det)"
        find: 'if isinstance(data.get("model_selection"), dict)'
        replace: 'if False'
      - id: explicit-request-loses-to-project
        description: "method explicito do call site deixa de vencer a preferencia do projeto"
        find: 'explicit or project_method or _settings_method(settings_obj) or _DEFAULT_METHOD'
        replace: 'project_method or explicit or _settings_method(settings_obj) or _DEFAULT_METHOD'
      - id: preserve-shape-project-ignored
        description: "preserve_real_aquarium_shape do projeto deixa de vencer o global"
        find: |-
          preserve = project_flag
              if preserve is None:
                  preserve = _settings_preserve_real_shape(settings_obj)
        replace: |-
          preserve = None
              if preserve is None:
                  preserve = _settings_preserve_real_shape(settings_obj)
      - id: uses-masks-drops-seg-check
        description: "uses_masks passa a valer para modelo det, que nao tem mascara"
        find: 'return self.method == "seg" and self.preserve_real_shape'
        replace: 'return self.preserve_real_shape'
      - id: invalid-flag-raises-instead-of-degrading
        description: "flag corrompida vira True em vez de cair para o nivel seguinte"
        find: |-
          log.warning(
                  "arena_detection_policy.preserve_real_shape.invalid",
                  source=source,
                  value=str(value),
              )
              return None
        replace: |-
          log.warning(
                  "arena_detection_policy.preserve_real_shape.invalid",
                  source=source,
                  value=str(value),
              )
              return True

  project_settings_snapshot:
    source: src/zebtrack/core/services/project_settings_snapshot.py
