        find: 'explicit = getattr(yolo_settings, "animal_confidence_threshold", None)'
        replace: 'explicit = None'
      - id: mock-override-accepted
        description: "override sem checagem de tipo: um Mock vira limiar de confianca"
        find: 'if isinstance(explicit, int | float) and not isinstance(explicit, bool) and 0 < explicit < 1:'
        replace: 'if explicit is not None:'
      - id: empty-dump-written-over-a-good-config
        description: "dump vazio deixa de ser recusado e sobrescreve a config existente"
        find: 'if not isinstance(config_data, dict) or not config_data:'
        replace: 'if False:'

  aquarium_detector:
    source: src/zebtrack/core/detection/aquarium_detector.py
    tests:
      - tests/test_aquarium_detector.py
      - tests/core/test_aquarium_detector_multi.py
      - tests/test_aquarium_detector_thresholds.py
    mutations:
      - id: degenerate-masks-not-filtered
        description: "sliver fantasma volta a concorrer e pode vencer a mascara real do tanque"
        find: 'usable = [j for j, poly in enumerate(polygons) if not is_degenerate_outline(poly)]'
        replace: 'usable = list(range(len(polygons)))'
      - id: consensus-populations-merged
        description: "bbox volta a competir com mascara no IoU e derruba a forma preservada"
        find: 'good_polygons = mask_polygons or bbox_polygons'
        replace: 'good_polygons = mask_polygons + bbox_polygons'
      - id: mask-choice-ignores-box-ranking
        description: "escolha da mascara deixa de seguir a caixa mais confiavel"
        find: |-
          for idx in rank_box_indices(confidences, boxes, frame_width, frame_height):
                      if idx in usable:
                          return idx
        replace: |-
          for idx in []:
                      if idx in usable:
                          return idx
      - id: fallback-pass-loses-class-filter
        description: "passe de baixa confianca volta a aceitar mascara de qualquer classe"
        find: |-
          results_all = self.model.predict(
                          frame, verbose=False, classes=[self.arena_class_id], conf=fallback_confidence
                      )
        replace: |-
          results_all = self.model.predict(
                          frame, verbose=False, conf=fallback_confidence
                      )
      - id: fallback-pass-loses-area-ceiling
        description: "passe de baixa confianca volta a aceitar mascara do quadro inteiro"
        find: 'if min_area_ratio <= area_ratio <= max_area_ratio:'
        replace: 'if area_ratio > 0.1:'
      - id: self-intersection-not-repaired
        description: "contorno auto-interseccionado volta a zerar o IoU e o consenso vira inerte"
        find: 'repaired = polygon.buffer(0)'
        replace: 'repaired = polygon'
      - id: multi-aquarium-ignores-masks
        description: "dois aquarios voltam a ser sempre retangulos, ignorando preserve_real_shape"
        find: 'use_masks = preserve_real_shape and self.mode == "seg"'
        replace: 'use_masks = False'

  sharp_turn_threshold:
