        find: 'arena_membership_rule: str = "centroid",'
        replace: 'arena_membership_rule: str = "any_corner",'
      - id: centroid-rule-adds-the-corners-back
        description: "regra de centroide passa a testar tambem os 4 cantos"
        find: 'if self.arena_membership_rule == "centroid":'
        replace: 'if self.arena_membership_rule == "nunca-casa":'
      - id: invalid-rule-not-normalized
        description: "regra invalida deixa de cair para centroid e vale como escrita"
        find: 'if arena_membership_rule not in self.VALID_MEMBERSHIP_RULES:'
        replace: 'if False:'

  animal_confidence:
