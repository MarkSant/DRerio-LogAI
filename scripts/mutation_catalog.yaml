        find: 'snapshot = _copy_settings(source)'
        replace: 'snapshot = source'
      - id: rejected-submodel-not-rolled-back
        description: "sub-modelo recusado fica aplicado e corrompe o snapshot em silencio"
        find: 'snapshot.__dict__[name] = current'
        replace: 'pass'

