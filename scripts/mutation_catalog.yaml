# Curated mutation catalogue for scripts/mutation_check.py
#
# Each mutation is a literal, single-occurrence source substitution that changes
# BEHAVIOUR in a way a competent test must notice. The point is not to be
# exhaustive -- it is to prove that the tests guarding the contracts CLAUDE.md
# calls critical actually fail when those contracts break.
#
# Choosing a mutation:
#   - It must change an observable outcome, not a log message or a comment.
#   - `find` must appear EXACTLY ONCE in the file (the runner enforces this).
#   - Prefer inverting a decision over deleting a branch: a deleted branch often
#     fails to import, which any test would "catch" for the wrong reason.
#
# A surviving mutation is a real hole. Fix it by adding the missing test, not by
# deleting the mutation.

modules:
  mask_capture:
    source: src/zebtrack/core/services/mask_capture.py
    tests:
      - tests/core/detection/test_mask_capture.py
      - tests/core/services/test_mask_capture_extended.py
    mutations:
      - id: no-settings-returns-true
        description: "settings_obj None passa a habilitar captura em vez de recusar"
        find: |-
          if settings_obj is None:
                  return False
        replace: |-
          if settings_obj is None:
                  return True
      - id: persist-masks-ignored
        description: "recorder.persist_masks desligado deixa de bloquear a captura"
        find: 'if not bool(getattr(recorder_settings, "persist_masks", False)):'
        replace: 'if False:'
      - id: det-model-accepted
        description: "modelo det passa a ser aceito para captura de mascara"
        find: '!= "seg":'
        replace: '== "seg":'
      - id: rule-not-checked
        description: "regra de ROI diferente de seg_overlap deixa de bloquear"
        find: 'if rule != "seg_overlap":'
        replace: 'if False:'

  external_trigger_gate:
    source: src/zebtrack/core/services/external_trigger_gate.py
    tests:
      - tests/core/services/test_external_trigger_gate.py
      - tests/core/services/test_external_trigger_gate_extended.py
    mutations:
      - id: trigger-off-arms
        description: "gatilho desligado passa a armar em vez de gravar direto"
        find: |-
          if not trigger_requested and not window_needs_arduino:
                  return ExternalTriggerDecision.PROCEED
        replace: |-
          if not trigger_requested and not window_needs_arduino:
                  return ExternalTriggerDecision.ARM_AND_WAIT
      - id: no-arduino-proceeds
        description: "gatilho ligado sem use_arduino GRAVA as cegas em vez de recusar"
        find: 'return ExternalTriggerDecision.REJECT_NO_ARDUINO'
        replace: 'return ExternalTriggerDecision.PROCEED'
      - id: offline-arduino-arms
        description: "Arduino desconectado passa a armar e esperar sinal que nao chega"
        find: 'return ExternalTriggerDecision.REJECT_ARDUINO_OFFLINE'
        replace: 'return ExternalTriggerDecision.ARM_AND_WAIT'
      - id: port-normalizer-drops-strip
        description: "normalize_arduino_port deixa de limpar espacos"
        find: |-
          return str(value).strip()
        replace: |-
          return str(value)
      # ---- v8 F5: analysis window that waits for the Arduino (ADR-011) ----
      - id: window-arduino-arms
        description: "janela com External(arduino) passa a ARMAR (esperar para gravar)"
        find: |-
          log.info("external_trigger_gate.window_waits_for_arduino")
                  return ExternalTriggerDecision.PROCEED
        replace: |-
          log.info("external_trigger_gate.window_waits_for_arduino")
                  return ExternalTriggerDecision.ARM_AND_WAIT
      - id: both-configured-accepted
        description: "gatilho legado + janela com Arduino passa a ser aceito"
        find: 'if trigger_requested and window_needs_arduino:'
        replace: 'if False:'
      - id: window-arduino-not-checked
        description: "janela com Arduino grava sem checar use_arduino nem a porta"
        find: 'if not trigger_requested and not window_needs_arduino:'
        replace: 'if not trigger_requested:'
      - id: nested-arduino-node-missed
        description: "so o no raiz da janela e olhado; External aninhado e ignorado"
        find: |-
          isinstance(node, External) and node.source == "arduino" for node in iter_nodes(root)
        replace: |-
          isinstance(node, External) and node.source == "arduino" for node in (root,)

  session_duration_resolver:
    source: src/zebtrack/core/services/session_duration_resolver.py
    tests:
      - tests/core/services/test_session_duration_resolver.py
      - tests/core/services/test_session_duration_resolver_extended.py
    mutations:
      - id: override-key-order-swapped
        description: "chave de override troca a ordem grupo/sujeito"
        find: 'return f"{_normalize_day(day)}|{str(group).strip()}|{str(subject).strip()}"'
        replace: 'return f"{_normalize_day(day)}|{str(subject).strip()}|{str(group).strip()}"'
      - id: zero-duration-accepted
        description: "duracao zero/negativa deixa de ser rejeitada e perde a gravacao"
        find: 'if duration <= 0 or duration != duration:  # NaN != NaN'
        replace: 'if duration != duration:  # NaN != NaN'
      - id: day-digits-not-normalized
        description: "dia numerico deixa de virar Dia_N, quebrando o casamento da chave"
        find: 'return f"Dia_{int(core)}"'
        replace: 'return core'

  experiment_notes:
    source: src/zebtrack/core/services/experiment_notes.py
    tests:
      - tests/core/services/test_experiment_notes.py
    mutations:
      - id: blank-note-stored
        description: "nota em branco passa a ser gravada em vez de apagar a anterior"
        find: 'if not cleaned:'
        replace: 'if False:'
      - id: legacy-block-key-kept
        description: "regravar a nota do bloco deixa a chave legada viva, que ressuscita ao limpar"
        find: 'notes.pop(_legacy_block_key(day, group), None)'
        replace: 'notes.get(_legacy_block_key(day, group), None)'
      - id: legacy-overrides-new
        description: "nota legada do bloco passa a sobrescrever a nova no relatorio"
        find: 'records.setdefault((record.day, record.group, None), record)'
        replace: 'records[(record.day, record.group, None)] = record'
      - id: subject-note-as-block-note
        description: "nota de sujeito passa a ser tratada como nota do bloco"
        find: 'if record.subject is None:'
        replace: 'if record.subject is not None:'

  arduino_bindings_panel:
    source: src/zebtrack/ui/components/arduino_bindings_panel.py
    tests:
      - tests/ui/components/test_arduino_bindings_panel.py
    mutations:
      - id: empty-project-data-discarded
        description: "project_data vazio de projeto recem-criado vira dict descartavel e o binding se perde (#644)"
        find: 'return data if isinstance(data, dict) else {}'
        replace: 'return data if data else {}'

  arduino_bindings_panel_aquarium_round_trip:
    source: src/zebtrack/ui/components/arduino_bindings_panel.py
    tests:
      - tests/ui/components/test_arduino_bindings_panel.py
    mutations:
      - id: row-read-back-unscoped
        description: "ler a linha da tabela descarta o aquarium_id e salvar pelo painel desescopa o binding (#701)"
        find: 'aquarium_id=cls._aquarium_id_from_cell(raw_aquarium),'
        replace: 'aquarium_id=None,'
      - id: row-written-without-aquarium
        description: "a linha da tabela deixa de guardar o aquarium_id na coluna oculta (#701)"
        find: '"" if aquarium_id is None else str(aquarium_id),'
        replace: '"",'
      - id: iid-ignores-aquarium
        description: "iid volta a ser so a ROI e ROIs homonimas de aquarios diferentes colidem numa linha (#701)"
        find: 'scope = "*" if aquarium_id is None else str(aquarium_id)'
        replace: 'scope = "*"'
      - id: hidden-picker-off-by-one
        description: "com o seletor oculto, o numero da linha escopada vira o aquario seguinte (#701)"
        find: 'return int(choice) - 1'
        replace: 'return int(choice)'
      - id: choice-maps-to-wrong-aquarium
        description: "a escolha '1' do seletor deixa de ser o aquario 0 (#701)"
        find: 'if aq_id is not None and aquarium_number(aq_id) == choice:'
        replace: 'if aq_id is not None and str(aq_id) == choice:'

  arduino_bindings:
    source: src/zebtrack/core/services/arduino_bindings.py
    tests:
      - tests/core/services/test_arduino_bindings_extended.py
    mutations:
      - id: token-conflict-never-detected
        description: "token usado como on_enter e on_exit deixa de ser reportado (trava dispositivo ligado)"
        find: 'for token in sorted(set(enter_by_token) & set(exit_by_token))'
        replace: 'for token in sorted(set(enter_by_token) & set(exit_by_token) & set())'
      - id: exit-tokens-not-indexed
        description: "on_exit deixa de entrar no indice, cegando a varredura de fim de sessao"
        find: |-
          if b.on_exit is not None:
                          exit_by_token.setdefault(b.on_exit, []).append(b.roi)
        replace: |-
          if b.on_exit is None:
                          exit_by_token.setdefault(b.on_exit, []).append(b.roi)

  roi_rule_resolver:
    source: src/zebtrack/core/services/roi_rule_resolver.py
    tests:
      - tests/core/services/test_roi_rule_resolver.py
    mutations:
      - id: default-rule-changed
        description: "regra padrao deixa de ser bbox_intersects"
        find: 'DEFAULT_ROI_INCLUSION_RULE: Final[str] = "bbox_intersects"'
        replace: 'DEFAULT_ROI_INCLUSION_RULE: Final[str] = "centroid_in"'
      - id: seg-and-bbox-thresholds-conflated
        description: "limiar de seg_overlap cai para o de bbox (denominadores diferentes)"
        find: 'DEFAULT_MIN_SEG_OVERLAP_RATIO: Final[float] = 0.3'
        replace: 'DEFAULT_MIN_SEG_OVERLAP_RATIO: Final[float] = 0.10'
      - id: flutter-enter-exit-swapped
        description: "frames de histerese de entrada e saida trocados"
        find: 'DEFAULT_ROI_FLUTTER_ENTER_FRAMES: Final[int] = 2'
        replace: 'DEFAULT_ROI_FLUTTER_ENTER_FRAMES: Final[int] = 3'

  arena_detection_policy:
    source: src/zebtrack/core/services/arena_detection_policy.py
    tests:
      - tests/core/test_arena_detection_policy.py
      - tests/coordinators/test_multi_aquarium_coordinator.py
    mutations:
      - id: project-method-ignored
        description: "aquarium_method do projeto deixa de ser lido (volta a fixar det)"
        find: 'if isinstance(data.get("model_selection"), dict)'
        replace: 'if False'
      - id: explicit-request-loses-to-project
        description: "method explicito do call site deixa de vencer a preferencia do projeto"
        find: 'explicit or project_method or _settings_method(settings_obj) or _DEFAULT_METHOD'
        replace: 'project_method or explicit or _settings_method(settings_obj) or _DEFAULT_METHOD'
      - id: preserve-shape-project-ignored
        description: "preserve_real_aquarium_shape do projeto deixa de vencer o global"
        find: |-
          preserve = project_flag
              if preserve is None:
                  preserve = _settings_preserve_real_shape(settings_obj)
        replace: |-
          preserve = None
              if preserve is None:
                  preserve = _settings_preserve_real_shape(settings_obj)
      - id: uses-masks-drops-seg-check
        description: "uses_masks passa a valer para modelo det, que nao tem mascara"
        find: 'return self.method == "seg" and self.preserve_real_shape'
        replace: 'return self.preserve_real_shape'
      - id: invalid-flag-raises-instead-of-degrading
        description: "flag corrompida vira True em vez de cair para o nivel seguinte"
        find: |-
          log.warning(
                  "arena_detection_policy.preserve_real_shape.invalid",
                  source=source,
                  value=str(value),
              )
              return None
        replace: |-
          log.warning(
                  "arena_detection_policy.preserve_real_shape.invalid",
                  source=source,
                  value=str(value),
              )
              return True

  project_settings_snapshot:
    source: src/zebtrack/core/services/project_settings_snapshot.py
    tests:
      - tests/core/test_project_settings_snapshot.py
      - tests/coordinators/test_roi_rule_propagation.py
      - tests/core/video/test_analysis_pipeline_runner.py
    mutations:
      - id: baseline-ignored
        description: "baseline da sessao deixa de vencer as settings vivas (o vazamento volta)"
        find: 'source = baseline if baseline is not None else settings_obj'
        replace: 'source = settings_obj'
      - id: shared-object-mutated
        description: "snapshot passa a ser o proprio objeto compartilhado, nao uma copia"
        find: 'snapshot = _copy_settings(source)'
        replace: 'snapshot = source'
      - id: rejected-submodel-not-rolled-back
        description: "sub-modelo recusado fica aplicado e corrompe o snapshot em silencio"
        find: 'snapshot.__dict__[name] = current'
        replace: 'pass'
      - id: project-speed-ceiling-not-copied
        description: "teto de velocidade do projeto deixa de chegar ao worker (#631)"
        find: '("max_plausible_speed_cm_s", "max_plausible_speed_cm_s"),'
        replace: '("max_plausible_speed_cm_s", "max_plausible_speed_cm_s_unused"),'

  weight_manager:
    source: src/zebtrack/core/services/weight_manager.py
    tests:
      - tests/core/services/test_weight_manager_extended.py
    mutations:
      - id: default-target-inverted
        description: "alvo padrao seg/det invertido"
        find: 'return TARGET_ZEBRAFISH if weight_type == "seg" else TARGET_AQUARIUM'
        replace: 'return TARGET_AQUARIUM if weight_type == "seg" else TARGET_ZEBRAFISH'
      - id: default-flag-key-swapped
        description: "chave is_default_{method}_{target} com ordem trocada"
        find: 'return f"is_default_{method}_{target}"'
        replace: 'return f"is_default_{target}_{method}"'
      - id: fish-alias-dropped
        description: 'alias "fish" deixa de resolver para zebrafish'
        find: 'if task in ("animal", "zebrafish", "fish"):'
        replace: 'if task in ("animal", "zebrafish"):'
      - id: lateral-perspective-broken
        description: "perspectiva lateral deixa de ser reconhecida no nome do arquivo"
        find: 'if "_lateral" in filename_lower:'
        replace: 'if "_lateralXX" in filename_lower:'
      - id: oi-suffix-classification-broken
        description: "sufixo _oi.pt deixa de classificar como det"
        find: 'if filename_lower.endswith("_oi.pt"):'
        replace: 'if filename_lower.endswith("_oiXX.pt"):'
      - id: legacy-openvino-cache-without-sha-check
        description: "pasta OpenVINO legada da 7.2 e reaproveitada sem conferir o sha do .pt"
        find: 'if sha and recorded == sha:'
        replace: 'if sha:'
      - id: openvino-cache-name-without-sha
        description: "pasta do cache OpenVINO deixa de levar o sha do peso no nome"
        find: 'tag = f"_{sha[:OPENVINO_CACHE_SHA_CHARS]}" if sha else ""'
        replace: 'tag = ""'
      - id: registry-points-anywhere-is-current
        description: "qualquer pasta registrada passa como export atual do peso"
        find: 'return os.path.normcase(os.path.abspath(recorded)) == os.path.normcase(reusable)'
        replace: 'return True'
      - id: sibling-json-overwrites-registry-roles
        description: "o JSON irmao do .pt sobrescreve class_roles ja gravados no registro"
        find: 'if "class_roles" not in details:'
        replace: 'if True:'
      - id: sha-cache-ignores-replaced-file
        description: "peso substituido no disco continua com o sha antigo em memoria"
        find: 'if cached and cached[0] == stat_result.st_size and cached[1] == stat_result.st_mtime_ns:'
        replace: 'if cached:'

  live_calibration_scale:
    source: src/zebtrack/core/services/live_calibration_scale.py
    tests:
      - tests/core/services/test_live_calibration_scale.py
      - tests/core/recording/test_live_analysis_post_processor.py
    mutations:
      - id: axes-swapped
        description: "px/cm dos eixos X e Y trocados (relatorio em cm errado nos dois eixos)"
        find: 'return (width_px / real_width, height_px / real_height)'
        replace: 'return (height_px / real_height, width_px / real_width)'
      - id: nonpositive-dimensions-accepted
        description: "dimensao <= 0 deixa de ser recusada e vira divisao invalida"
        find: 'if real_width <= 0 or real_height <= 0:'
        replace: 'if False:'
      - id: degenerate-bbox-accepted
        description: "poligono degenerado (span zero) passa a devolver escala 0"
        find: 'if width_px <= 0 or height_px <= 0:'
        replace: 'if False:'
      - id: two-vertex-polygon-accepted
        description: "poligono com menos de 3 vertices deixa de ser recusado"
        find: 'if len(points) < 3:'
        replace: 'if False:'

  arena_candidate_selection:
    source: src/zebtrack/core/detection/arena_candidate_selection.py
    tests:
      - tests/core/test_arena_candidate_selection.py
      - tests/test_aquarium_detector.py
    mutations:
      - id: ranked-by-area-instead-of-confidence
        description: "candidato vence por tamanho, nao por confianca (a caixa gorda ganha)"
        find: 'order = sorted(range(count), key=lambda i: float(confidences[i]), reverse=True)'
        replace: 'order = sorted(range(count), key=lambda i: _box_area(boxes_xyxy[i]), reverse=True)'
      - id: area-ceiling-dropped
        description: "caixa cobrindo o campo de visao inteiro passa a ser aceita como arena"
        find: 'if min_area_ratio <= (_box_area(boxes_xyxy[idx]) / frame_area) <= max_area_ratio'
        replace: 'if min_area_ratio <= (_box_area(boxes_xyxy[idx]) / frame_area)'
      - id: degenerate-outline-accepted
        description: "mascara de altura zero deixa de ser filtrada e derruba a mascara real"
        find: 'return (max(xs) - min(xs)) <= 0 or (max(ys) - min(ys)) <= 0'
        replace: 'return False'
      - id: two-vertex-outline-accepted
        description: "contorno com menos de 3 vertices deixa de ser degenerado"
        find: 'if len(polygon) < 3:'
        replace: 'if len(polygon) < 0:'

  zone_scaler:
    source: src/zebtrack/core/detection/zone_scaler.py
    tests:
      - tests/core/test_zone_scaler.py
      - tests/core/detection/test_zone_scaler_extended.py
    mutations:
      - id: membership-defaults-to-any-corner
        description: "regra padrao volta a ser 4 cantos, admitindo centroide fora da arena"
        find: 'arena_membership_rule: str = "centroid",'
        replace: 'arena_membership_rule: str = "any_corner",'
      - id: centroid-rule-adds-the-corners-back
        description: "regra de centroide passa a testar tambem os 4 cantos"
        find: 'if self.arena_membership_rule == "centroid":'
        replace: 'if self.arena_membership_rule == "nunca-casa":'
      - id: invalid-rule-not-normalized
        description: "regra invalida deixa de cair para centroid e vale como escrita"
        find: 'if arena_membership_rule not in self.VALID_MEMBERSHIP_RULES:'
        replace: 'if False:'

  animal_confidence:
    source: src/zebtrack/settings.py
    tests:
      - tests/test_settings.py
      - tests/plugins/test_ultralytics_detector.py
    mutations:
      - id: animal-threshold-ignored
        description: "limiar do animal deixa de ser lido e o da arena volta a governar"
        find: 'explicit = getattr(yolo_settings, "animal_confidence_threshold", None)'
        replace: 'explicit = None'
      - id: mock-override-accepted
        description: "override sem checagem de tipo: um Mock vira limiar de confianca"
        find: 'if isinstance(explicit, int | float) and not isinstance(explicit, bool) and 0 < explicit < 1:'
        replace: 'if explicit is not None:'
      - id: empty-dump-written-over-a-good-config
        description: "dump vazio deixa de ser recusado e sobrescreve a config existente"
        find: 'if not isinstance(config_data, dict) or not config_data:'
        replace: 'if False:'

  aquarium_detector:
    source: src/zebtrack/core/detection/aquarium_detector.py
    tests:
      - tests/test_aquarium_detector.py
      - tests/core/test_aquarium_detector_multi.py
      - tests/test_aquarium_detector_thresholds.py
    mutations:
      - id: degenerate-masks-not-filtered
        description: "sliver fantasma volta a concorrer e pode vencer a mascara real do tanque"
        find: 'usable = [j for j, poly in enumerate(polygons) if not is_degenerate_outline(poly)]'
        replace: 'usable = list(range(len(polygons)))'
      - id: consensus-populations-merged
        description: "bbox volta a competir com mascara no IoU e derruba a forma preservada"
        find: 'good_polygons = mask_polygons or bbox_polygons'
        replace: 'good_polygons = mask_polygons + bbox_polygons'
      - id: mask-choice-ignores-box-ranking
        description: "escolha da mascara deixa de seguir a caixa mais confiavel"
        find: |-
          for idx in rank_box_indices(confidences, boxes, frame_width, frame_height):
                      if idx in usable:
                          return idx
        replace: |-
          for idx in []:
                      if idx in usable:
                          return idx
      - id: fallback-pass-loses-class-filter
        description: "passe de baixa confianca volta a aceitar mascara de qualquer classe"
        find: |-
          results_all = self.model.predict(
                          frame, verbose=False, classes=[self.arena_class_id], conf=fallback_confidence
                      )
        replace: |-
          results_all = self.model.predict(
                          frame, verbose=False, conf=fallback_confidence
                      )
      - id: fallback-pass-loses-area-ceiling
        description: "passe de baixa confianca volta a aceitar mascara do quadro inteiro"
        find: 'if min_area_ratio <= area_ratio <= max_area_ratio:'
        replace: 'if area_ratio > 0.1:'
      - id: self-intersection-not-repaired
        description: "contorno auto-interseccionado volta a zerar o IoU e o consenso vira inerte"
        find: 'repaired = polygon.buffer(0)'
        replace: 'repaired = polygon'
      - id: multi-aquarium-ignores-masks
        description: "dois aquarios voltam a ser sempre retangulos, ignorando preserve_real_shape"
        find: 'use_masks = preserve_real_shape and self.mode == "seg"'
        replace: 'use_masks = False'

  aquarium_detector_multi_area_ratio:
    source: src/zebtrack/core/detection/aquarium_detector.py
    tests:
      - tests/core/test_aquarium_detector_multi.py
    mutations:
      - id: max-area-ratio-ignored
        description: "#726: dois aquarios voltam a ignorar o max_area_ratio documentado"
        find: 'multi_max_ratio = min(max_area_ratio, MULTI_AQUARIUM_MAX_AREA_RATIO)'
        replace: 'multi_max_ratio = MULTI_AQUARIUM_MAX_AREA_RATIO'
      - id: two-tank-cap-lost
        description: "#726: o teto de meio quadro por aquario some e 0.98 aceita caixas gigantes"
        find: 'multi_max_ratio = min(max_area_ratio, MULTI_AQUARIUM_MAX_AREA_RATIO)'
        replace: 'multi_max_ratio = max_area_ratio'

  sharp_turn_threshold:
    source: src/zebtrack/analysis/analysis_service.py
    tests:
      - tests/analysis/test_sharp_turn_threshold_resolver.py
      - tests/integration/test_prerecorded_golden.py
    mutations:
      - id: threshold-ignored-by-the-computation
        description: "contagem de curvas volta a ignorar o limiar configurado (o defeito original)"
        find: '"curvas_acentuadas": b_analyzer.calculate_sharp_turns(sharp_turn_threshold),'
        replace: '"curvas_acentuadas": b_analyzer.calculate_sharp_turns(90.0),'
      - id: settings-win-over-project
        description: "precedencia invertida: o objeto compartilhado passa na frente do projeto e o vazamento volta"
        find: '    nested = (params or {}).get("analysis")'
        replace: '    nested = {} if getattr(getattr(settings_obj, "video_processing", None), "sharp_turn_threshold_deg_s", None) is not None else (params or {}).get("analysis")'
