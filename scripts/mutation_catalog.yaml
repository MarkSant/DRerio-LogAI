        find: 'order = sorted(range(count), key=lambda i: float(confidences[i]), reverse=True)'
        replace: 'order = sorted(range(count), key=lambda i: _box_area(boxes_xyxy[i]), reverse=True)'
      - id: area-ceiling-dropped
        description: "caixa cobrindo o campo de visao inteiro passa a ser aceita como arena"
        find: 'if min_area_ratio <= (_box_area(boxes_xyxy[idx]) / frame_area) <= max_area_ratio'
        replace: 'if min_area_ratio <= (_box_area(boxes_xyxy[idx]) / frame_area)'
      - id: degenerate-outline-accepted
        description: "mascara de altura zero deixa de ser filtrada e derruba a mascara real"
        find: 'return (max(xs) - min(xs)) <= 0 or (max(ys) - min(ys)) <= 0'
        replace: 'return False'
      - id: two-vertex-outline-accepted
        description: "contorno com menos de 3 vertices deixa de ser degenerado"
        find: 'if len(polygon) < 3:'
        replace: 'if len(polygon) < 0:'

  zone_scaler:
    source: src/zebtrack/core/detection/zone_scaler.py
    tests:
