# =============================================================================
# DRerio LogAI Configuration File
# =============================================================================
# This is the main configuration file for the DRerio LogAI application.
# It defines all system settings including camera, detection models, tracking
# parameters, and analysis behaviors.
#
# Configuration System:
#   - This file (config.yaml) contains the base/default configuration
#   - Create config.local.yaml to override values without modifying this file
#   - config.local.yaml is git-ignored for machine-specific settings
#   - All settings are validated using Pydantic models for type safety
#
# For detailed documentation, see: docs/REFERENCE_GUIDE.md
# To export JSON Schema: python -c "from zebtrack.settings import export_schema; export_schema(Path('schema.json'))"
# =============================================================================

# -----------------------------------------------------------------------------
# Camera Settings
# -----------------------------------------------------------------------------
camera:
  # Camera device index (0 for default webcam, 1+ for additional cameras)
  # Use config.local.yaml to override this for your specific setup
  index: 1

  # Reference resolution for zone definitions (zones are auto-scaled to actual camera resolution)
  # These dimensions define the coordinate space when drawing detection zones in the GUI
  desired_width: 1280
  desired_height: 720

  # Maximum number of times to try reconnecting if the camera signal is lost
  # 0 = try forever
  max_reconnect_attempts: 10

  # Total time (in seconds) to keep trying to reconnect before giving up
  # 0 = no time limit
  reconnect_timeout_seconds: 60.0

  # Maximum acceptable frame lag in milliseconds
  # Warnings logged if frame age exceeds this threshold
  max_frame_lag_ms: 500.0

# -----------------------------------------------------------------------------
# Live Camera Analysis Settings
# -----------------------------------------------------------------------------
live_analysis:
  # Default duration for live analysis sessions (in seconds, max 7200 = 2 hours)
  default_duration_s: 300.0  # 5 minutes

  # Maximum allowed duration for live analysis sessions (in seconds)
  max_duration_s: 7200.0  # 2 hours

  # Automatically stop recording when duration limit is reached
  auto_stop_on_limit: true

  # Show countdown timer before starting live analysis
  show_countdown: true

  # Countdown duration in seconds (0-60)
  countdown_duration_s: 5

# -----------------------------------------------------------------------------
# Arduino Settings (optional hardware integration)
# -----------------------------------------------------------------------------
arduino:
  # Serial port (COM5 on Windows, /dev/ttyACM0 on Linux/Mac)
  # Used for sending zone-based commands to Arduino hardware
  port: 'COM5'
  baud_rate: 9600
  # Consecutive analysed frames with zero detections tolerated before the
  # per-zone command loop emits the ROI exit token. Absorbs momentary tracker
  # misses that would otherwise make the device flicker off/on. 0 = legacy.
  roi_exit_grace_frames: 2

# -----------------------------------------------------------------------------
# Recorder Settings (Parquet/Video Output)
# -----------------------------------------------------------------------------
recorder:
  # Auto-flush detection data to disk periodically to prevent data loss
  flush_interval_seconds: 5.0  # Flush every N seconds
  flush_row_threshold: 500     # Or when N detections buffered (whichever comes first)
  # Persist segmentation masks to the 3b_Mascaras_<base>.parquet sidecar.
  # Required by the "seg_overlap" ROI rule, which has no other source of masks.
  # Costs NOTHING while False: no mask is decoded and no file is created. Only
  # takes effect with a segmentation model (model_selection.animal_method: "seg").
  # See docs/guides/developer/performance-tuning.md § 1.1 for the measured cost.
  persist_masks: false

# -----------------------------------------------------------------------------
# YOLO Model Settings (Object Detection)
# -----------------------------------------------------------------------------
yolo_model:
  # Path to model weights file (.pt format)
  # This path is used as fallback; actual model selection happens via model_selection section
  # Path is relative to the project root; weights live under weights.source_dir.
  path: 'weights/best_seg.pt'

  # Confidence threshold: detections below this score are ignored
  # Range: 0.0-1.0. Lower values detect more but may increase false positives
  # Typical: 0.05-0.5 depending on model quality and use case
  confidence_threshold: 0.05

  # Non-Maximum Suppression (NMS) threshold: filters overlapping bounding boxes
  # Range: 0.0-1.0. Higher values allow more overlap between detections
  # Typical: 0.3-0.7
  nms_threshold: 0.5

  # OPTIMIZATION: Performance settings for inference
  # Enable FP16 (half precision) inference on GPU
  # Auto-disabled if CUDA is not available; provides ~2x speedup on NVIDIA GPUs
  use_half_precision: true

  # Input image size for YOLO inference (must be divisible by 32)
  # Smaller = faster, Larger = more accurate for small objects
  # Valid values: 320, 416, 512, 640, 768, 896, 1024, 1280
  inference_size: 640

# -----------------------------------------------------------------------------
# ByteTrack Settings (Multi-Object Tracking)
# -----------------------------------------------------------------------------
bytetrack:
  # Track association thresholds used by ByteTrack algorithm
  # track_threshold: minimum confidence to keep tracking an object (Range: 0.0-1.0)
  # match_threshold: threshold for associating detections to tracks (Range: 0.0-1.0)
  #   IMPORTANT: Higher values are MORE PERMISSIVE (allow larger distance/lower IoU)
  #   For sparse frame processing (every N frames), use higher values (0.7-0.95)
  #   to maintain stable track IDs despite larger movements between frames.
  #
  # NOTE: The Kalman Filter's dt parameter is automatically set to the
  # processing_interval value (from video_processing section) to correctly
  # model motion predictions over larger time steps. This is CRITICAL for
  # stable track IDs when processing every N frames.
  track_threshold: 0.25
  match_threshold: 0.95  # Higher = more permissive, better for fast-moving objects

  # Hybrid matching for sparse frame processing (analyzing every N frames)
  # When IoU-based matching fails (no bbox overlap), ByteTrack falls back to
  # center-distance matching. This is essential for small, fast-moving objects
  # like zebrafish that can move significantly between processed frames.
  max_center_distance: 400.0  # pixels, ~13 body lengths for 30px zebrafish

  # Track buffer: frames to keep lost tracks before removing (scaled by processing_interval)
  # Higher values allow re-identification after longer occlusions
  track_buffer: 150  # With interval=10, survives ~50 detection cycles (~5s at 30fps)

  # IoU threshold for hybrid matching: below this, use center distance instead
  # Lower values (0.0-0.1) work better for small objects with little overlap
  iou_threshold: 0.05

# -----------------------------------------------------------------------------
# Video Processing Settings
# -----------------------------------------------------------------------------
video_processing:
  # Output video frame rate (FPS) when recording annotated videos
  fps: 30

  # Frame processing interval: process every Nth frame for detection
  # Higher values = faster processing but lower temporal resolution
  # Example: interval=10 means detect on frames 1, 11, 21, ...
  processing_interval: 10

  # Frame offset: starting frame for detection cycle
  # Example: offset=1, interval=10 → process frames 1, 11, 21, ...
  #          offset=0, interval=10 → process frames 0, 10, 20, ...
  processing_offset: 1

  # Behavioral thresholds (used in analysis phase)
  sharp_turn_threshold_deg_s: 90.0  # Degrees/second to classify as sharp turn
  freezing_velocity_threshold: 1.5   # cm/s below which animal is "frozen"
  freezing_min_duration_s: 1.0       # Minimum duration to count as freezing episode

  # Single-animal mode: force track_id=1 for all detections (ignores multi-animal tracking)
  single_animal_per_aquarium: false

  # Behavior when a video fails in batch processing: "continue" or "stop"
  batch_retry_strategy: "continue"

# -----------------------------------------------------------------------------
# Reproducibility Settings
# -----------------------------------------------------------------------------
reproducibility:
  # Random seed for NumPy, PyTorch, and other RNG-dependent operations
  # Using the same seed ensures reproducible results across runs
  seed: 42

# -----------------------------------------------------------------------------
# Model Selection (Detection vs Segmentation)
# -----------------------------------------------------------------------------
model_selection:
  # Aquarium/arena detection method: "seg" (segmentation) or "det" (bounding box detection)
  # Segmentation provides pixel-precise boundaries; detection is faster but less accurate
  aquarium_method: "seg"

  # Animal tracking method: "seg" or "det"
  # Most use cases work well with "det" for speed; use "seg" for precise shape analysis
  animal_method: "det"

  # Use OpenVINO for inference (auto-detected based on hardware benchmark)
  # Set to true to force OpenVINO, false to force PyTorch
  # If left at default, the system will auto-detect optimal backend
  use_openvino: false

# -----------------------------------------------------------------------------
# OpenVINO Settings (Hardware Acceleration)
# -----------------------------------------------------------------------------
# These settings control how OpenVINO uses your hardware for inference.
# The system runs a hardware benchmark on first startup and auto-configures
# optimal settings. You can override them here if needed.
openvino:
  # Device for inference: "AUTO" (let OpenVINO choose), "CPU", "GPU", "NPU"
  # "NPU" requires Intel Core Ultra (Meteor Lake+) with NPU driver installed.
  # Benchmark will determine the fastest device for your system.
  device: "AUTO"

  # Device for batch/offline video processing (can differ from live)
  device_batch: "AUTO"

  # Enable NPU turbo mode (higher clocks, more power; not for sustained loads)
  # Only applies when device is NPU; ignored otherwise.
  npu_turbo: false

  # Performance hint for live camera analysis
  # "LATENCY" = minimize delay per frame (recommended for real-time)
  # "THROUGHPUT" = maximize frames/second (may increase latency)
  # WARNING: "THROUGHPUT" can be very slow on Intel integrated GPUs (Iris Xe)
  performance_hint_live: "LATENCY"

  # Performance hint for batch video processing
  performance_hint_batch: "LATENCY"

  # Inference precision: "FP32" (default), "FP16" (faster on some GPUs), "INT8" (requires quantized model)
  precision: "FP32"

  # Cache compiled models to speed up subsequent startups
  # First run compiles GPU kernels (30-60s), later runs load from cache
  enable_model_cache: true
  cache_dir: "openvino_model_cache/compiled_cache"

  # Run hardware benchmark on first startup to detect optimal settings
  auto_benchmark: true

  # Number of parallel inference requests for batch mode (AsyncInferQueue).
  # Higher values overlap preprocessing with device inference for better
  # throughput but consume more memory. Typical range: 2-8.
  batch_nireq: 4

# -----------------------------------------------------------------------------
# Weight File Selection (Perspective-Aware)
# -----------------------------------------------------------------------------
# Weights are grouped by camera perspective (lateral vs top-down).
# The wizard auto-suggests the correct weights based on the selected perspective.
# All filenames below are resolved against `source_dir` (default: "weights/").
weights:
  # Folder (relative to project root) where the .pt weight files live.
  # The WeightManager auto-discovers any best_*_lateral.pt / best_*_topdown.pt
  # placed inside this folder.
  source_dir: "weights"

  lateral:
    seg_filename: "best_seg_lateral.pt"  # Segmentation model for lateral view
    det_filename: "best_det_lateral.pt"  # Detection model for lateral view
  top_down:
    seg_filename: "best_seg_topdown.pt"  # Segmentation model for top-down view
    det_filename: "best_det_topdown.pt"  # Detection model for top-down view

# -----------------------------------------------------------------------------
# ROI Inclusion Rules (Region of Interest Analysis)
# -----------------------------------------------------------------------------
# Determines when an animal is considered "inside" an ROI for behavioral analysis
# Options:
#   - "centroid_in": Center point of bounding box must be inside ROI polygon
#   - "centroid_in_on_buffered_roi": Center point inside buffered (expanded) ROI
#   - "bbox_intersects": Bounding box overlaps the ROI by at least
#     roi_min_bbox_overlap_ratio of the reference area (default)
#   - "seg_overlap": Segmentation mask overlaps with ROI (requires segmentation)
roi_inclusion_rule: "bbox_intersects"

# Buffer radius for "centroid_in_on_buffered_roi" mode, in cm. Default: 0.5.
# Converted to pixels by the geometric mean of the calibration,
# sqrt(px_per_cm_x * px_per_cm_y); with no calibration the factor is 1.0,
# so the value ends up being in pixels. Same single source of truth as the keys
# below — shown commented out; uncomment only to override.
# roi_buffer_radius_value: 0.5

# The two settings below have a SINGLE source of truth: the Pydantic defaults in
# src/zebtrack/settings.py. They are shown commented out so that the values here
# can never drift from the ones the analysis actually uses — uncomment only to
# override them.
#
# Minimum overlap fraction for "bbox_intersects" (0.0-1.0), and for the
# "bbox_intersects" FALLBACK that "seg_overlap" uses when masks are missing.
# Default: 0.10. For "bbox_intersects" only, 0.0 has a meaning of its own —
# any non-zero overlap area counts, with no minimum fraction (a bounding box
# merely touching the ROI border does NOT count).
# roi_min_bbox_overlap_ratio: 0.10
#
# Denominator of that fraction. Default: "bbox".
#   - "bbox": intersection / bbox area (historical behaviour)
#   - "roi":  intersection / ROI area
#   - "max":  the larger of the two — recommended when ROIs are small relative
#     to the animal's bounding box, where "bbox" under-reports badly (a bbox 4x
#     the ROI area covering 100% of the ROI still only scores 0.25).
# roi_bbox_overlap_basis: "bbox"
#
# Minimum fraction of the SEGMENTATION MASK inside the ROI, for "seg_overlap"
# only. Default: 0.3. This is a SEPARATE field from roi_min_bbox_overlap_ratio
# on purpose: the denominator there is a bounding box (which drags along the
# empty corners around the animal), here it is the mask itself (which IS the
# animal). The two fractions are not comparable, so neither can default to the
# other — 0.10 of a mask is a much stricter overlap than 0.10 of a bbox.
# Zero is not accepted: a mask merely touching the ROI is not an animal inside.
# roi_min_seg_overlap_ratio: 0.3

# -----------------------------------------------------------------------------
# ROI Presence Debounce and Duration Filters
# -----------------------------------------------------------------------------
# These decide WHEN a raw presence reading counts as a visit. Same single source
# of truth as above: the Pydantic defaults in src/zebtrack/settings.py. Shown
# commented out; uncomment only to override.
#
# Order of operations: raw presence -> debounce (backdated) -> duration filters
# -> stable series -> metrics.
#
# Consecutive frames required to confirm an entry / an exit. The confirmed
# transition is BACKDATED to the first frame of the run, so these do NOT delay
# the recorded timestamps (that bias is why the filter used to be disabled).
# Asymmetric on purpose: a one-frame dropout mid-visit is not an exit.
# Set both to 1 to disable debouncing. Defaults: 2 and 3.
# roi_flutter_enter_frames: 2
# roi_flutter_exit_frames: 3
#
# Duration thresholds, in SECONDS (not frames: a frame count would silently
# change meaning when analysis_interval_frames changes).
#   - roi_min_visit_s: visits shorter than this are discarded. Default: 0.2
#   - roi_min_gap_s:   gaps shorter than this merge the two adjacent visits
#                      into one. Default: 0.0 (disabled)
# roi_min_visit_s: 0.2
# roi_min_gap_s: 0.0
#
# Cap on the time credited to an ROI for a single trajectory step. Without it,
# a 5 s tracking gap is credited IN FULL to whichever ROI the animal reappeared
# in. The discarded excess is reported as analise_roi.tempo_nao_observado_s.
#   - null (default): automatic, 3x the median observed interval
#   - a number:       explicit cap, in seconds
#   - .inf:           no cap (historical behaviour)
# roi_max_gap_s: null

# -----------------------------------------------------------------------------
# Trajectory Smoothing (Savitzky-Golay Filter)
# -----------------------------------------------------------------------------
trajectory_smoothing:
  # Savitzky-Golay filter parameters for smoothing trajectory coordinates
  # window_length: must be odd, larger = more smoothing (typical: 5-11)
  # polyorder: polynomial order, must be < window_length (typical: 2-3)
  window_length: 7
  polyorder: 3

# -----------------------------------------------------------------------------
# Angular Velocity Calculation (Jitter-Robust)
# -----------------------------------------------------------------------------
angular_velocity:
  # Minimum displacement threshold (cm) to calculate valid angular velocity
  # Below this, animal is considered stationary → angular velocity = NaN
  # Prevents noise amplification from detector jitter (~1-2 pixels)
  # Typical: 0.3-1.0 cm depending on resolution and detector quality
  min_displacement_threshold_cm: 0.5

  # Frame step for angle calculation (temporal window)
  # 1 = consecutive frames (F-1, F, F+1) → high temporal resolution, more noise
  # 3 = skip frames (F-3, F, F+3) → lower noise, reduced temporal resolution
  # Use 2-5 for very noisy detectors
  angle_calculation_window: 1

  # Moving average smoothing window for angular velocity time series
  # 1 = no smoothing
  # 3-5 = light smoothing to reduce high-frequency noise
  # Must be odd or 1
  angular_velocity_smoothing_window: 3

# -----------------------------------------------------------------------------
# Tracking Settings
# -----------------------------------------------------------------------------
tracking:
  # Use the advanced ByteTrack algorithm (Kalman Filter + IoU matching)
  # Provides high stability but higher overhead. Recommended for most cases.
  use_bytetrack: true

  # Use lightweight single-subject tracker instead of ByteTrack for single-animal experiments
  # Reduces overhead when you know there's only one animal in the arena
  use_single_subject_tracker: false

# -----------------------------------------------------------------------------
# UI Feature Flags (Progressive Rollout)
# -----------------------------------------------------------------------------
ui_features:
  # Use 5-step wizard for project creation (v1.6+ default: true)
  # Legacy dialog remains available for backward compatibility
  use_wizard_for_project_creation: true

  # Enable async event bus for controller↔GUI communication (Phase 1 refactoring)
  # Default: false (staged migration, still using root.after for UI updates)
  enable_event_queue: false

  # Suppress warning when generating unified reports from videos with different ROI schemas
  # Default: false (show warning to ensure user understands ROI consistency implications)
  # Set to true if you regularly merge data from videos with intentionally different ROIs
  suppress_roi_mismatch_warning: false

# -----------------------------------------------------------------------------
# User Interface Preferences
# -----------------------------------------------------------------------------
ui:
  # Interface and report language: "en" (default) or "pt_BR".
  # Asked once on first launch and stored in config.local.yaml; also changeable
  # from Settings -> Language. Applied at startup, not while running.
  # The operating system locale is deliberately NOT consulted.
  language: en

# -----------------------------------------------------------------------------
# Performance & Parallelization (Phase 8)
# -----------------------------------------------------------------------------
performance:
  # Maximum number of videos to process concurrently
  # Higher values improve batch throughput but consume more RAM
  # Recommended: 2-3 for typical systems, 4 for high-RAM machines
  max_parallel_videos: 2

  # Maximum number of plots to generate in parallel during report generation
  # Speeds up report creation by parallelizing matplotlib operations
  # Recommended: 3 (higher values may cause thread contention)
  max_parallel_plots: 3

  # Parquet compression codec
  # Options:
  #   - "snappy": Fast compression with good ratio (default, recommended)
  #   - "gzip": Better compression but slower write/read
  #   - "none": No compression (fastest but larger files)
  parquet_compression: "snappy"

  # Enable parallel execution of independent analysis components
  # When true, BehavioralAnalyzer and ROIAnalyzer may run concurrently
  enable_parallel_analysis: true

  # Memory usage mode for constrained hardware
  # Options:
  #   - "normal": Full parallelism and buffering (default)
  #   - "low": Reduces batch_nireq to 1, disables parallel analysis,
  #            increases processing interval. Auto-detected if RAM < 8 GB.
  memory_mode: "normal"

  # Automatically select inference_size based on hardware benchmark
  # When true, CPU-only systems may use 416 or 320 for faster inference
  # Set to false to always use the configured yolo_model.inference_size
  auto_inference_size: true

# -----------------------------------------------------------------------------
# Logging Settings
# -----------------------------------------------------------------------------
logging:
  levels:
    zebtrack: INFO
    zebtrack.core.detector: INFO  # Can be overridden to DEBUG for development
    zebtrack.ui: WARNING
    zebtrack.io: WARNING
    zebtrack.analysis: INFO

# =============================================================================
# End of Configuration
# =============================================================================
# For advanced customization, edit config.local.yaml (git-ignored)
# For validation schema, run: python -c "from zebtrack.settings import export_schema; export_schema(Path('schema.json'))"
# =============================================================================
