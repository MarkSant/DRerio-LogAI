# DRerio LogAI Impact Map
# Quick-lookup map for AI agents to understand component dependencies.
# Last Updated: 2026-05-09 (v2.1 — expanded events section, fixed doc refs)
#
# Usage: agents should consult this file BEFORE making changes.
# Companion files:
#   - CLAUDE.md ............ canonical agent guide
#   - DOMAIN_GLOSSARY.md ... vocabulary
#   - TEST_MAP.md .......... source → tests routing

# =============================================================================
# DOMAIN DEPENDENCY GRAPHS
# =============================================================================

domains:
  # ---------------------------------------------------------------------------
  # EVENTS DOMAIN
  # ---------------------------------------------------------------------------
  events:
    description: "Event-driven communication between components"

    event_bus:
      definition_file: "src/zebtrack/ui/event_bus_v2.py"
      event_format: "Enum (UIEvents) — sole event bus; v1 removed"
      payload_module: "src/zebtrack/ui/payloads.py"
      use_for: "All cross-component communication"
      naming_convention: "DOMAIN_ACTION_RESULT (UPPER_SNAKE_CASE)"
      total_events: "~200 (see UIEvents enum); subset documented below"

      # ── Lookup notes ─────────────────────────────────────────────────
      # When a payload field name differs from what's listed here, check
      # the dataclass in payloads.py — payload classes mirror event names
      # (e.g. ZONE_PROCESSING_MODE_CHANGED → ZoneProcessingModeChangedPayload).
      # When publishers/subscribers are uncertain, grep for `bus.publish(UIEvents.NAME`
      # and `subscribe(UIEvents.NAME`.

      critical_events:
        # ── Project lifecycle ───────────────────────────────────────────
        PROJECT_CREATE:
          handlers: "coordinators/project_lifecycle_coordinator.py"
          payload: "ProjectCreatePayload (wizard config dict)"

        PROJECT_OPEN:
          handlers: "coordinators/project_lifecycle_coordinator.py"
          payload: "{project_path: str}"

        PROJECT_CLOSE:
          handlers: "coordinators/project_lifecycle_coordinator.py"

        PROJECT_PROCESS_VIDEOS:
          publishers: ["ui/components/project_views/*"]
          subscribers: ["coordinators/video_processing_coordinator.py"]
          payload: "list of video paths to process in batch"

        PROJECT_DELETE_GROUP / PROJECT_DELETE_DAY / PROJECT_DELETE_SUBJECT / PROJECT_DELETE_AQUARIUM:
          subscribers: ["coordinators/project_lifecycle_coordinator.py"]
          note: "Cascade deletion in subject hierarchy tree."

        PROJECT_RESET_ANALYSIS_DATA:
          subscribers: ["coordinators/project_lifecycle_coordinator.py"]
          note: "Resets parquet outputs for a video without deleting raw video."

        PROJECT_VIDEO_SELECTED:
          publishers: ["ui/components/project_views/*"]
          payload: "{video_path: str}"

        # ── Video processing ────────────────────────────────────────────
        VIDEO_ANALYZE_SINGLE:
          publishers: ["ui/dialogs/single_video_config_dialog.py"]
          subscribers: ["coordinators/video_processing_coordinator.py"]
          payload: "{video_path: str, config: dict}"

        VIDEO_START_SINGLE_PROCESSING:
          subscribers: ["coordinators/video_processing_coordinator.py"]
          note: "Internal: actual start after config validation."

        VIDEO_CANCEL_ANALYSIS:
          publishers: ["ui/gui.py"]
          subscribers: ["coordinators/video_processing_coordinator.py.cancel_processing()"]

        # ── Multi-aquarium (CRITICAL DOMAIN) ────────────────────────────
        ZONE_MULTI_AUTO_DETECT:
          publishers: ["ui/components/zone_controls.py"]
          subscribers: ["coordinators/multi_aquarium_coordinator.py"]
          payload: "{video_path, stabilization_frames, expected_count}"

        ZONE_MULTI_AUTO_DETECT_SUCCESS:
          payload: "{video_path: str, polygons: list}"

        ZONE_MULTI_AUTO_DETECT_FAILED:
          payload: "{video_path: str, reason: str}"

        ZONE_AQUARIUM_SELECTED:
          publishers: ["ui/components/zone_controls.py"]
          subscribers: ["ui/components/event_dispatcher.py -> CanvasManager.update_zone_listbox()"]
          payload: "{aquarium_id: int}"

        ZONE_MULTI_DETECT_COMPLETED:
          payload: "{count: int, aquariums: list}"

        ZONE_AQUARIUM_CONFIG_CONFIRMED:
          payload: "{configs: list[AquariumConfig]}"
          note: "Aquarium-to-subject assignment finalized."

        ZONE_AQUARIUM_CONFIG_UPDATED:
          subscribers: ["coordinators/project_lifecycle_coordinator.py._handle_aquarium_config_updated()"]
          payload: "{aquarium_id, config, video_path}"

        ZONE_AQUARIUM_COUNT_CONFIRMED:
          payload: "{count: int}"

        ZONE_AQUARIUM_ASSIGNMENT_COMPLETED:
          payload: "{configs, apply_to_all: bool}"

        ZONE_PROCESSING_MODE_CHANGED:
          publishers: ["ui/components/zone_controls.py"]
          subscribers: ["coordinators/multi_aquarium_coordinator.py"]
          payload: "ZoneProcessingModeChangedPayload(sequential: bool)"
          note: "Multi-aquarium parallel-vs-sequential toggle. NOT the same as UI_UPDATE_PROCESSING_MODE."

        # ── Reports / analysis ──────────────────────────────────────────
        PROCESSING_GENERATE_TRAJECTORIES:
          subscribers: ["coordinators/report_generation_coordinator.py"]
          note: "Required handler — earlier versions emitted 'no handlers' warnings."

        PROCESSING_EXPORT_SUMMARIES:
          subscribers: ["coordinators/report_generation_coordinator.py"]

        REPORTS_GENERATE_PARTIAL / REPORTS_GENERATE_UNIFIED:
          subscribers: ["coordinators/report_generation_coordinator.py"]

        REPORTS_DELETE_UNIFIED:
          subscribers: ["coordinators/report_generation_coordinator.py"]
          note: "Includes retry-with-unlock for OneDrive sync locks (v3.3)."

        # ── Calibration ─────────────────────────────────────────────────
        CALIBRATION_RUN_LIVE / CALIBRATION_COPY_TO_PROJECT / CALIBRATION_SAVE_TO_PROJECT:
          subscribers: ["coordinators/calibration_coordinator.py"]

        # ── Detector / model / weights ──────────────────────────────────
        DETECTOR_SETUP / DETECTOR_SETUP_ZONES / DETECTOR_UPDATE_PARAMETERS / DETECTOR_UPDATE_ZONES:
          subscribers: ["coordinators/detector_setup_coordinator.py"]

        MODEL_SET_WEIGHT / MODEL_ADD_WEIGHT / MODEL_DELETE_WEIGHT / MODEL_RESCAN_WEIGHTS:
          subscribers: ["coordinators/detector_setup_coordinator.py"]

        MODEL_SET_OPENVINO / MODEL_CONVERT_OPENVINO / MODEL_CLEAR_OPENVINO_CACHE:
          subscribers: ["coordinators/detector_setup_coordinator.py"]

        # ── Recording / live camera ─────────────────────────────────────
        RECORDING_START / RECORDING_STOP / RECORDING_TOGGLE / RECORDING_TRIGGER:
          subscribers: ["coordinators/live_camera_session_coordinator.py", "core/recording/recording_service.py"]

        LIVE_SESSION_STARTED / LIVE_SESSION_STOPPED:
          publishers: ["coordinators/live_camera_session_coordinator.py"]
          note: "Internal state markers."

        # ── UI commands (ViewModel → View) ──────────────────────────────
        UI_UPDATE_PROCESSING_MODE:
          payload: "UpdateProcessingModePayload(report=ProcessingReport(mode, source))"
          note: "Tracking algorithm mode (MULTI_TRACK vs SINGLE_SUBJECT). NOT the multi-aquarium toggle — that's ZONE_PROCESSING_MODE_CHANGED."

        UI_DISPLAY_FRAME:
          publishers: ["core/video/processing_worker.py"]
          subscribers: ["ui/components/event_dispatcher.py -> CanvasManager"]
          payload: "{frame: np.ndarray, detections: list (opt), info: dict (opt)}"
          note: "Only for ProcessingWorker. Live Camera uses LivePreviewWindow directly."

        UI_UPDATE_LIVE_FRAME:
          publishers: ["core/recording/live_camera_service.py"]
          subscribers: ["ui/dialogs/live_preview_window.py"]

        UI_SHOW_ERROR / UI_SHOW_WARNING / UI_SHOW_INFO:
          subscribers: ["ui/gui.py.show_error/show_warning/show_info"]
          payload: "MessagePayload(title: str, message: str)"

        UI_REFRESH_PROJECT_VIEWS:
          subscribers: ["ui/components/project_views/*"]

        UI_NAVIGATE_TO_WELCOME / UI_NAVIGATE_TO_PROJECT_VIEW / UI_NAVIGATE_TO_ANALYSIS_VIEW:
          subscribers: ["ui/gui.py"]

        UI_UPDATE_ANALYSIS_METADATA:
          subscribers: ["ui/components/*"]

        UI_UPDATE_PROCESSING_STATS:
          publishers: ["coordinators/progress_tracking_coordinator.py"]
          subscribers: ["ui/components/*"]
          payload: "{total_frames, processed_frames, detected_frames, start_time}"

        # ── Legacy / generic widget events ──────────────────────────────
        ZONES_UPDATED:
          publishers: ["ui/dialogs/dialog_manager.py", "ui/components/canvas/*", "ui/gui.py"]
          subscribers: ["ui/components/event_dispatcher.py", "ui/components/canvas/*"]

        VIDEO_TREE_REFRESH_REQUESTED:
          publishers: ["ui/dialogs/dialog_manager.py", "ui/components/zone_controls.py"]
          subscribers: ["ui/components/project_views/*"]

        WIZARD_CREATE_PROJECT:
          publishers: ["ui/wizard/*"]
          subscribers: ["coordinators/project_lifecycle_coordinator.py"]
          payload: "WizardData (Pydantic model in ui/wizard/models.py)"

  # ---------------------------------------------------------------------------
  # MULTI-AQUARIUM DOMAIN (CRITICAL)
  # ---------------------------------------------------------------------------
  multi_aquarium:
    description: "Multi-aquarium detection and processing"
    critical_rule: "ALWAYS use get_multi_aquarium_zone_data() not get_zone_data()"

    data_flow:
      - step: 1
        component: "ZoneControls"
        action: "User configures aquariums"

      - step: 2
        component: "VideoProcessingCoordinator"
        action: "serialize_zones() using ZoneManager.multi_aquarium_zone_data_to_dict"

      - step: 3
        component: "ProcessingWorker"
        action: "deserialize using ZoneManager.multi_aquarium_zone_data_from_dict"

      - step: 4
        component: "Detector"
        action: "detect_partitioned_optimized() for each aquarium"

      - step: 5
        component: "Recorder"
        action: "write_partitioned_detection_data() with aquarium_id in track"

      - step: 6
        component: "AnalysisService"
        action: "run_multi_aquarium_analysis() generates per-aquarium results"

      - step: 7
        component: "ProjectManager"
        action: "register_multi_aquarium_outputs() persists results"

    track_id_convention: "aquarium_id * 1000 + local_track_id"
    output_structure: "<video>_aquarium_N/ directories"

    key_files:
      - "src/zebtrack/core/project/zone_manager.py"
      - "src/zebtrack/core/project/project_manager.py"
      - "src/zebtrack/plugins/detector.py"
      - "src/zebtrack/io/recorder.py"
      - "src/zebtrack/analysis/analysis_service.py"
      - "src/zebtrack/coordinators/video_processing_coordinator.py"

  # ---------------------------------------------------------------------------
  # SETTINGS/DI DOMAIN
  # ---------------------------------------------------------------------------
  settings:
    description: "Configuration and dependency injection"

    injection_chain:
      - source: "config.yaml / config.local.yaml"
        target: "load_settings()"

      - source: "load_settings()"
        target: "core/application_bootstrapper.py (Composition Root)"

      - source: "Composition Root (ApplicationBootstrapper)"
        target: "All services via settings_obj parameter"

    critical_rule: "NEVER import singleton 'from zebtrack import settings'"

    pydantic_models: "src/zebtrack/settings.py"
    composition_root: "src/zebtrack/core/application_bootstrapper.py"

    services_receiving_settings_obj:
      - "ProjectManager"
      - "DetectorService"
      - "ProcessingWorker (via ProcessingContext)"
      - "Recorder"
      - "AnalysisService"
      - "LiveCameraService"
      - "WizardService"
      - "All Coordinators"

  # ---------------------------------------------------------------------------
  # UI/THREADING DOMAIN
  # ---------------------------------------------------------------------------
  ui:
    description: "Tkinter UI and threading constraints"

    critical_rule: "All UI updates MUST use root.after(0, ...)"

    thread_safe_components:
      - "StateManager (thread-safe for cross-thread updates)"

    thread_sensitive_components:
      - "All Tkinter widgets (main thread only)"
      - "CanvasManager"
      - "All dialogs"

    update_patterns:
      correct: "root.after(0, lambda: widget.config(...))"
      incorrect: "widget.config(...) from worker thread"

    tab_awareness:
      - component: "CanvasManager"
        behavior: "Overlays only drawn when is_on_analysis_tab=True"
        location: "ui/components/canvas_manager.py"

  # ---------------------------------------------------------------------------
  # PROCESSING DOMAIN
  # ---------------------------------------------------------------------------
  processing:
    description: "Video processing pipeline"

    pipeline_steps:
      - "VideoSource -> frames"
      - "DetectorService -> detections with zones"
      - "Recorder -> Parquet + MP4"
      - "AnalysisService -> behavioral metrics"
      - "Reporter -> Word/Excel reports"

    parquet_schema:
      columns: ["timestamp", "frame", "track_id", "x1", "y1", "x2", "y2", "confidence"]
      optional: ["x_center_px", "y_center_px", "x_cm", "y_cm"]
      rule: "IMMUTABLE - column order is fixed"

    key_files:
      - "src/zebtrack/core/video/processing_worker.py"
      - "src/zebtrack/core/services/detector_service.py"
      - "src/zebtrack/io/recorder.py"
      - "src/zebtrack/io/video_source.py"

  # ---------------------------------------------------------------------------
  # FRAME LEDGER (live session timeline: parquet frame <-> MP4 frame <-> clock)
  # ---------------------------------------------------------------------------
  frame_ledger:
    description: "Sidecar mapping pipeline_frame <-> video_frame_index <-> capture instant"

    why: "Three independent numberings (capture frame_count, MP4 write counter, clock); a single lost frame shifted every later mapping with no trace on disk"

    output:
      ledger: "6_FrameLedger_<base>.{csv,parquet} — one row per CAPTURED frame"
      anchor: "6_FrameLedger_<base>_anchor.json — t0_perf/t0_wall pair (MANDATORY: perf_counter has no epoch), recorder_start_time, fps_nominal, fps_real_medio, analysis_interval_frames, first_captured_index, first_video_index"
      columns: ["pipeline_frame", "video_frame_index", "t_capture_perf", "t_capture_wall", "outcome", "is_analysis_frame", "queued_for_analysis"]

    outcomes: "written | dropped_queue_full (capture thread) | write_failed (video thread, OSError after dequeue) | not_recording"

    producers: "TWO threads, ONE lock: capture writes dropped_queue_full/not_recording; video writes written/write_failed with the REAL index from the write counter (never inferred as frame_count - drops)"

    queue_item: "video_queue carries (frame_count, capture_perf, capture_wall, is_analysis_frame, queued_for_analysis, frame); legacy bare-frame items tolerated (no ledger row). frame_queue unchanged: (frame_count, frame, capture_perf)"

    reconstruction: "3_CoordMovimento.frame == pipeline_frame -> t_capture_perf -> t0_wall + (t_capture_perf - t0_perf) -> video_frame_index"

    gotchas:
      timestamp_is_processing_clock: "3_CoordMovimento.timestamp is measured AFTER queue wait + inference; NEVER use it for latency or to date an event. Schema stays IMMUTABLE — fix at consumption time by joining the ledger"
      opportunistic_spacing: "Parquet rows are NOT only multiples of analysis_interval_frames (off-cadence frames are enqueued when frame_queue has room); filter by is_analysis_frame to recover the deterministic cadence"
      driver_buffering: "perf_counter after camera.get_frame() = frame available to PYTHON, not sensor exposure. UVC buffering (1-3 frames) is invisible and enters frame_to_ack_ms in full"
      writer_returns_none: "cv2.VideoWriter.write() reports nothing; outcome='written' = no Python exception, NOT encoder confirmation"
      no_sync_io: "record() only appends to memory; CSV flush runs on FrameLedgerWriterThread (daemon)"

    lifecycle: "_reset_frame_ledger in _start_threads -> _maybe_bind_frame_ledger when recorder.output_folder exists -> _finalize_frame_ledger in stop_session AFTER joining producer threads. Independent of the Arduino/closed-loop path"

    key_files:
      - "src/zebtrack/core/recording/frame_ledger.py"                # FrameLedger + load/reconstruction helpers
      - "src/zebtrack/core/recording/frame_processing_pipeline.py"   # capture/video producers
      - "src/zebtrack/core/recording/live_session_manager.py"        # finalize after join

    related_tests:
      - "tests/core/recording/test_frame_ledger.py"
      - "tests/core/recording/test_frame_timeline_reconstruction.py"

  # ---------------------------------------------------------------------------
  # ARDUINO DOMAIN (live per-zone commands + closed-loop latency)
  # ---------------------------------------------------------------------------
  arduino:
    description: "Live per-zone Arduino commands and closed-loop latency logging"

    transport:
      model: "DRerio sends integers only; firmware decides what each token does"
      trigger: "Edge-triggered ROI enter/exit (any-track), fire-and-forget"
      config: "project_data['use_arduino'] + project_data['arduino_bindings']"
      manager_not_singleton: "ArduinoManager instantiated in bootstrap; shared"

    robustness:
      token_conflicts: "Same int as one ROI's on_enter and another's on_exit latches a device ON and breaks the session-end sweep; token_conflicts() warns, never rewrites"
      canonical_layout: "Reference sketch: Z1=1/2, Z2=3/4, Z3=5/6, Z4=7/8 (ON/OFF are consecutive pairs, NOT enters 1-4 / exits 5-8)"
      ack_verification: "token_conflicts() is blind to unique-but-wrong-edge layouts; arduino_ack_semantics reads the firmware ACK (enter answering OFF = inverted). Pre-flight: ArduinoManager.probe_tokens + panel 'Testar comandos'. Runtime: arduino_zone_commands.ack_inverted, deduped per (roi, edge)"
      probe_owns_sink: "probe_tokens temporarily takes the latency sink, so it raises while a live session holds one"
      exit_grace: "arduino.roi_exit_grace_frames (default 2) absorbs empty-detection frames before emitting ROI exit; 0 = legacy immediate exit"
      firmware_rule: "NO delay() in loop() — it blocks serial reads, collapses enter/exit pairs into an invisible flash and inflates serial_act_ms. Button pins need INPUT_PULLUP (floating INPUT self-triggers)"

    closed_loop_latency:
      purpose: "Software-only frame->LED latency via firmware textual ACK"
      marks: "frame_t0 (capture) / t_send (writer) / t_ack (reader), perf_counter"
      correlation: "FIFO: writer registers pending; reader matches next TEXT ACK"
      gotcha: "Numeric inbound = device event; text = ACK. Async send => t_ack on reader thread"
      output: "5_ClosedLoop_<base>.{csv,parquet} (canonical serial_act_ms, frame_to_ack_ms)"
      caveat: "frame_to_ack starts at ANALYZED frame; sampling quantization is separate"
      columns_append_only: "CSV_COLUMNS is append-only; serial_act_ms/frame_to_ack_ms stay first (analise_latencia.py depends on the names). queue_wait_ms + inference_ms + dequeue_perf appended Aug 2026"
      split: "queue_wait_ms (frame_t0->dequeue) + inference_ms (dequeue->decision) == capture_to_decision_ms (kept for compat)"

    key_files:
      - "src/zebtrack/io/arduino_manager.py"          # enqueue_tracked, sink, ACK FIFO
      - "src/zebtrack/io/arduino.py"                   # send_command_async (ser.write)
      - "src/zebtrack/core/services/arduino_bindings.py"       # ROI->token config
      - "src/zebtrack/core/services/arduino_event_mapper.py"   # update_detailed -> RoiTokenEvent
      - "src/zebtrack/core/services/arduino_roi_evaluator.py"  # ROI occupancy (rule from roi_rule_resolver)
      - "src/zebtrack/core/services/arduino_ack_semantics.py"  # ACK -> on/off, inversion check
      - "src/zebtrack/core/services/closed_loop_latency.py"    # ClosedLoopLatencyLog
      - "src/zebtrack/core/recording/frame_processing_pipeline.py"  # dispatch + lifecycle
      - "src/zebtrack/ui/components/arduino_bindings_panel.py" # editor + conflict warning
      - "scripts/ard_sketch/Program_Final/Program_Final.ino"   # reference firmware

    related_tests:
      - "tests/core/test_arduino_zone_dispatch.py"
      - "tests/core/test_arduino_bindings.py"
      - "tests/core/test_arduino_ack_semantics.py"
      - "tests/core/test_arduino_event_mapper.py"
      - "tests/test_io_arduino_manager_probe.py"
      - "tests/core/test_closed_loop_latency.py"
      - "tests/test_io_arduino_manager.py"
      - "tests/ui/components/test_arduino_bindings_panel.py"

  # ---------------------------------------------------------------------------
  # ROI INCLUSION RULE DOMAIN (canonical resolver)
  # ---------------------------------------------------------------------------
  roi_inclusion_rule:
    description: "Single source of truth for 'is the animal inside this ROI?'"

    contract:
      resolver: "resolve_roi_rule(project_data, settings_obj) -> RoiRuleConfig (frozen, pure)"
      precedence: "project_data['roi_settings'] > settings_obj > default"
      keys: "GEOMETRY: roi_inclusion_rule, roi_buffer_radius_value, roi_min_bbox_overlap_ratio, roi_bbox_overlap_basis. TIMING: roi_flutter_enter_frames, roi_flutter_exit_frames, roi_min_visit_s, roi_min_gap_s, roi_max_gap_s (no other keys)"
      invalid_values: "never raises; falls back one level and logs roi_rule.resolve.invalid_value"
      apply: "apply_roi_rule_to_settings orders rule+2 numeric assignments so Settings' cross-field validator never sees an invalid intermediate state — do NOT hand-assign. roi_bbox_overlap_basis has no cross-field invariant and is written first"
      single_default: "Settings' Pydantic field is the ONE place a ROI default lives. config.yaml must NOT re-declare roi_min_bbox_overlap_ratio / roi_bbox_overlap_basis (it used to say 0.05 vs the model's 0.10), and UI StringVars are seeded from the resolved rule, never from literals"

    consumers:
      prerecorded_report: "coordinators/_video_selection_mixin.py::_create_project_settings_snapshot"
      report_regeneration: "coordinators/report_generation_coordinator.py::_create_project_settings_snapshot"
      live_post_processing: "core/recording/live_analysis_post_processor.py::_build_post_analysis_service"
      live_arduino: "core/recording/frame_processing_pipeline.py::_build_arduino_evaluator"
      analyzer: "analysis/analysis_service.py::resolve_roi_rule -> ROIAnalyzer"

    gotchas:
      parity: "ArduinoRoiEvaluator uses shapely (same predicates as ROIAnalyzer), not cv2.pointPolygonTest; bboxes are forwarded raw — reducing them to centroids makes bbox_intersects impossible"
      buffer_units: "buffered ROI dilated ONCE in the constructor; px_per_cm must be sqrt(pixelcm_x*pixelcm_y) to match ROIAnalyzer"
      seg_overlap: "unimplemented in roi.py (raises); the live evaluator degrades to centroid_in and logs seg_overlap_unsupported_fallback"
      ui_apply: "Zones tab 'Aplicar' emits ZONE_APPLY_ROI_SETTINGS (persists). DETECTOR_UPDATE_PARAMETERS silently drops the ROI keys"
      no_float_in_ui: "The payload carries raw StringVar text; float() inside a Tk callback raises on bad input and kills the click. Parsing/validation happens once, in resolve_roi_rule (non-finite included)"
      degenerate_bbox: "bbox_intersects divides by the box AREA — both dimensions must be > 0. A zero-side box falls back to the centroid WITH the warning, never silently"
      zero_threshold: "roi_min_bbox_overlap_ratio == 0 is legal ONLY for bbox_intersects and means 'any non-zero overlap AREA'. Evaluated with the DE-9IM pattern T******** (interiors intersect) — NOT shapely.intersects, which is True for tangency, and NOT area > 0, which is noisy near tangency. seg_overlap still requires > 0"
      overlap_basis: "roi_bbox_overlap_basis picks the fraction's denominator: bbox (default, historical) | roi | max. Default keeps old numbers bit-for-bit; 'bbox' under-reports small ROIs (bbox 4x the ROI area covering 100% of it scores 0.25)"
      or_default_trap: "ROIAnalyzer uses `if x is None`, never `x or default`: 0.0 is a meaningful threshold and `or` would silently swap it for 0.10"
      negative_threshold: "A NEGATIVE ratio is invalid and dangerous in both directions: treated as the 0 special case it masks bad input; passed through to `ratio >= threshold` it matches boxes that do not even touch the ROI. RoiRuleConfig.__post_init__ sanitizes EVERY construction path (not just resolve_roi_rule) and logs roi_rule.config.sanitized; ROIAnalyzer routes its raw float params through the same config"
      overlap_any_scope: "`overlap_any` is `rule == bbox_intersects AND ratio == 0.0` — not `ratio <= 0`. A loose `<= 0` would route invalid negatives into the topological path; a bare `== 0.0` would answer True for seg_overlap, where 0 is invalid"
      filter_order: "raw presence -> debounce (BACKDATED) -> duration filters (min_visit, then via merge min_gap) -> stable series -> metrics. NOT commutative: filtering by duration before the debounce measures events the debounce is about to move or delete"
      backdating: "The confirmed transition is recorded at the FIRST frame of the run, not where confirmation completed. The old rolling(N, min_periods=1) window recorded it N-1 frames late and biased latencia_primeira_entrada / tempo_gasto_por_roi proportionally to N — which is why production hardcoded flutter_n_frames=1. Raising N now costs no timestamp bias"
      seconds_not_frames: "roi_min_visit_s / roi_min_gap_s / roi_max_gap_s are DURATIONS. A frame count is not invariant: changing analysis_interval_frames changes the series rate and silently changes what an N-frame filter does"
      gap_attribution: "The trajectory only has rows where a detection happened, so the dt after a tracking gap IS the whole gap and used to be credited entirely to the ROI of reappearance. roi_max_gap_s caps it (null = auto, 3x median interval; .inf = no cap); the excess goes to ROIAnalyzer.unobserved_time_s -> report['analise_roi']['tempo_nao_observado_s']"
      neutral_mode: "enter=1, exit=1, min_visit_s=0, min_gap_s=0, max_gap_s=inf reproduces the historical output BIT FOR BIT (the dt column is not rewritten unless the cap binds, avoiding Timedelta->seconds->Timedelta rounding). Pinned by tests/analysis/test_roi_flutter.py::TestNeutralModeIsBitIdentical"
      legacy_flutter_n: "flutter_n_frames stays accepted as the legacy SYMMETRIC input and maps to both windows; an explicit window wins. analyze_center_vs_periphery now passes everything by KEYWORD — it used to pass the debounce as the third positional, so inserting a parameter before it would swap the argument silently"
      arduino_has_no_timing: "ArduinoRoiEvaluator applies NO temporal filter: it is per-frame geometry and the live loop has no series. Parity tests must neutralize the temporal layer, or they compare different things"
      timing_not_in_ui: "The five timing keys are not editable from the UI yet — config.yaml / config.local.yaml / project_data['roi_settings'] only, like arduino.roi_exit_grace_frames"
      visit_duration_is_credited_time: "A visit's duration is the time CREDITED to its own frames (exclusive prefix-sum clock `_clock_s`, length n+1) — the same sum get_time_spent_in_rois reports. Measuring `t[end] - t[start]` instead embeds the dt of the first frame OUTSIDE the visit; when that frame is the reappearance after a gap, the gap inflates the PRECEDING visit, defeating the cap. Found in review of #455"
      max_gap_missing_vs_null: "roi_max_gap_s is the ONE key where None is a VALUE ('automatic'), not an absence. The resolver uses a _MISSING sentinel, never a bare .get(key)/getattr(...,None): otherwise a project can never override a numeric global back to auto, and since to_roi_settings() always writes the key, persisting an auto project against a numeric global silently resurrects the global number on the next resolve"
      defaults_duplicated_on_purpose: "DEFAULT_ROI_* in roi_rule_resolver duplicate the Settings Pydantic defaults. Referencing the constants from Field(default=...) would be circular: any import under zebtrack.core.services runs that package __init__, which loads DetectorService and pulls zebtrack.settings back in (42 modules). settings.py is a deliberate leaf with no zebtrack imports. Drift is blocked by test_resolver_defaults_match_settings_defaults, which covers all NINE ROI keys"

    key_files:
      - "src/zebtrack/core/services/roi_rule_resolver.py"
      - "src/zebtrack/analysis/analysis_service.py"
      - "src/zebtrack/analysis/roi.py"
      - "src/zebtrack/core/services/arduino_roi_evaluator.py"
      - "src/zebtrack/coordinators/_video_selection_mixin.py"
      - "src/zebtrack/coordinators/report_generation_coordinator.py"
      - "src/zebtrack/core/recording/live_analysis_post_processor.py"
      - "src/zebtrack/ui/components/event_dispatcher.py"
      - "src/zebtrack/ui/components/zone_controls.py"
      - "src/zebtrack/ui/builders/zone_control_builder.py"
      - "src/zebtrack/ui/components/tab_builder.py"      # seeds the Zones panel with the effective rule
      - "src/zebtrack/ui/components/config_editor.py"    # global ROI form (incl. overlap basis)
      - "src/zebtrack/settings.py"                       # the ONE place the defaults live
      - "config.yaml"                                    # must not re-declare the ratio/basis

    related_tests:
      - "tests/core/services/test_roi_rule_resolver.py"
      - "tests/coordinators/test_roi_rule_propagation.py"
      - "tests/core/test_arduino_roi_evaluator.py"
      - "tests/ui/components/test_roi_settings_persistence.py"
      - "tests/analysis/test_roi_analyzer.py"
      - "tests/analysis/test_roi_flutter.py"
      - "tests/analysis/test_roi_time_attribution.py"
      - "tests/ui/components/test_zone_controls_widget.py"
      - "tests/ui/components/test_config_editor.py"
      - "tests/test_settings.py"

# =============================================================================
# COORDINATOR HIERARCHY
# =============================================================================

coordinators:
  MainViewModel:
    role: "Top-level orchestrator"
    dependencies: "MainViewModelDependencies dataclass + DependencyContainer"
    location: "src/zebtrack/core/main_view_model.py"

  VideoProcessingCoordinator:
    role: "Video processing, zone serialization"
    handles: ["VIDEO_ANALYZE_SINGLE", "VIDEO_CANCEL_ANALYSIS"]
    location: "src/zebtrack/coordinators/video_processing_coordinator.py"

  ReportGenerationCoordinator:
    role: "Report generation, trajectory generation"
    handles: ["PROCESSING_GENERATE_TRAJECTORIES", "report events"]
    location: "src/zebtrack/coordinators/report_generation_coordinator.py"

  MultiAquariumCoordinator:
    role: "Multi-aquarium detection and zone config"
    handles: ["ZONE_MULTI_AUTO_DETECT", "ZONE_AQUARIUM_CONFIG_CONFIRMED"]
    location: "src/zebtrack/coordinators/multi_aquarium_coordinator.py"

  SequentialProcessingCoordinator:
    role: "Sequential multi-aquarium processing (2 passes)"
    handles: ["Sequential aquarium processing flow"]
    location: "src/zebtrack/coordinators/sequential_processing_coordinator.py"

  DetectorSetupCoordinator:
    role: "Detector, model, weight management"
    handles: ["MODEL_SET_WEIGHT", "DETECTOR_SETUP"]
    location: "src/zebtrack/coordinators/detector_setup_coordinator.py"

  LiveCameraSessionCoordinator:
    role: "Live camera session management"
    handles: ["Live camera start/stop events"]
    location: "src/zebtrack/coordinators/live_camera_session_coordinator.py"

  ProjectLifecycleCoordinator:
    role: "Project CRUD, calibration, zones"
    handles: ["PROJECT_CREATE", "PROJECT_OPEN", "ZONE_AQUARIUM_CONFIG_UPDATED"]
    location: "src/zebtrack/coordinators/project_lifecycle_coordinator.py"

  CalibrationCoordinator:
    role: "Calibration workflows"
    handles: ["Calibration events"]
    location: "src/zebtrack/coordinators/calibration_coordinator.py"

# =============================================================================
# SERIALIZATION CHAINS
# =============================================================================

serialization:
  ZoneData:
    serializer: "ZoneManager.zone_data_to_dict"
    deserializer: "ZoneManager.zone_data_from_dict"
    crosses: "VideoProcessingCoordinator -> ProcessingWorker"

  MultiAquariumZoneData:
    serializer: "ZoneManager.multi_aquarium_zone_data_to_dict"
    deserializer: "ZoneManager.multi_aquarium_zone_data_from_dict"
    crosses: "VideoProcessingCoordinator -> ProcessingWorker"
    critical: "MUST use multi-aquarium serializer, not single-aquarium"

  ProcessingContext:
    serializer: "VideoProcessingCoordinator._create_context"
    deserializer: "ProcessingWorker.__init__"
    crosses: "Main process -> Worker process"

  Settings:
    serializer: "settings.model_dump()"
    deserializer: "Settings(**dict)"
    crosses: "Config files -> Application"

# =============================================================================
# TEST MAPPING
# =============================================================================

tests:
  gui:
    command: "pytest -m gui -n0"
    count: "~949 tests"
    covers: ["ui/", "widgets/", "dialogs/"]

  processing:
    command: "pytest tests/test_processing*.py tests/test_recorder.py"
    covers: ["core/video/processing_worker.py", "io/recorder.py"]

  multi_aquarium:
    command: 'pytest -k "multi_aquarium or partitioned"'
    covers: ["Multi-aquarium data flow", "Zone serialization"]

  events:
    command: "pytest tests/test_event*.py tests/coordinators/"
    covers: ["Event bus", "Coordinators"]

  analysis:
    command: "pytest tests/test_analysis*.py tests/test_reporter*.py"
    covers: ["analysis/", "Reporter"]

  full:
    command: "pytest -m '' -n0"
    count: "~2778 tests"
    time: "6-7 minutes"
    coverage_requirement: "45% (Linux CI), 28% (Windows CI)"

# =============================================================================
# COMMON PITFALLS (Quick Reference)
# =============================================================================

pitfalls:
  - id: 1
    name: "Missing event payload keys"
    impact: "UI crash or silent failure"
    check: "Verify payload matches docs/reference/system_integration.md"

  - id: 2
    name: "Using get_zone_data() for multi-aquarium"
    impact: "Aquarium 1 gets Aquarium 0 data"
    check: "Use get_multi_aquarium_zone_data() instead"

  - id: 3
    name: "Forgetting root.after() for UI updates"
    impact: "Thread safety violation, random crashes"
    check: "All non-main-thread UI updates use root.after(0, ...)"

  - id: 4
    name: "Not rescaling zones after video dimensions"
    impact: "Zones in wrong position"
    check: "Call Detector.set_zones() after video loaded"

  - id: 5
    name: "Singleton settings import"
    impact: "Tests fail, DI broken"
    check: "Use settings_obj parameter, not 'from zebtrack import settings'"

  - id: 6
    name: "Using deleted EventBus v1 APIs"
    impact: "Import errors, events never received"
    check: "EventBusV2 is the sole event bus; UIEvents enum in ui/event_bus_v2.py"

  - id: 7
    name: "ByteTracker Kalman drift"
    impact: "Tracks outside polygon"
    check: "Post-filter after _apply_byte_tracking()"

  - id: 8
    name: "Modifying Parquet schema"
    impact: "Breaking change, corrupts data"
    check: "Schema is IMMUTABLE - requires migration"

