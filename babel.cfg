# Babel extraction config for the "zebtrack" (user interface) catalogue domain.
#
# Driven by scripts/update_translations.py -- run that rather than pybabel
# directly, so the .pot, the pt_BR .po and the compiled .mo stay in step.
#
# Keywords are passed on the command line (see the script): _, gettext, lazy and
# ngettext:1,2.
[python: **.py]
encoding = utf-8
